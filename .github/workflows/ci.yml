name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Verify MoonBit module
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          moon update
          moon info
          moon check
          moon build
          moon test
          moon package --list
